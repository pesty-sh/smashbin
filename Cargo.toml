[workspace]
resolver = "2"
members = ["crates/smashbin-core", "crates/smashbin"]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.88"
authors = ["pesty-sh <pesty@pesty.sh>"]
license = "MIT"
repository = "https://github.com/pesty-sh/smashbin"
homepage = "https://pesty.sh"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
