[package]
name = "smashbin"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
description = "Offline image smasher. Strips metadata and resizes."
authors = ["pesty-sh <pesty@pesty.sh>"]
license = "MIT"
repository = "https://github.com/pesty-sh/smashbin"
homepage = "https://pesty.sh"
readme = "README.md"
keywords = ["jpeg", "png", "offline", "privacy", "image"]
categories = ["command-line-utilities", "multimedia::images"]

# These are compiled into the one binary. None of them is C, and none of
# them is a second program the user has to install.
#   clap          reads the flags
#   img-parts     lifts metadata out of a JPEG, PNG, or GIF container
#   png           recompresses a PNG. Pure Rust. Pixels stay the same.
#   image         reads pixels and resizes them. JPEG and GIF go through it.
#                 `--format` also writes the pure-Rust formats listed below.
#                 WebP is lossless. AVIF and lossy WebP need a C library, so
#                 they are not enabled.
#   jpeg-encoder  writes those pixels into a new JPEG
[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
img-parts = { version = "0.4.2", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
png = "0.18.1"

[dev-dependencies]
assert_cmd = "2.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Metadata for the `cargo deb` tool used by GitHub Actions.
# `make deb` does not read this table. It still builds the glibc 2.27
# packages with packaging/mkdeb.py.
# cargo-deb is not linked into the smashbin binary. The release workflow
# installs it only while packing a .deb.
# Compression is not a field here. The workflow passes `--compress-type gzip`
# so Ubuntu 14.04 and Debian 8 dpkg can unpack the archive. Current cargo-deb
# defaults to xz, which some of those old dpkg builds reject.
# An empty depends list stops cargo-deb from adding libc6. The GitHub Release
# binaries are static musl and do not need the system C library.
[package.metadata.deb]
maintainer = "pesty-sh <pesty@pesty.sh>"
copyright = "2026 pesty-sh"
section = "graphics"
priority = "optional"
depends = ""
extended-description = """
Strips metadata and resizes an image on your own machine.
No network access and no telemetry.
The GitHub Release build is a static binary. It does not need glibc.
Installing or removing this package only adds or removes /usr/bin/smashbin.
"""
assets = [
    # `target/release/` is a token cargo-deb rewrites for the real target dir.
    ["target/release/smashbin", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/smashbin/README.md", "644"],
    ["LICENSE", "usr/share/doc/smashbin/LICENSE", "644"],
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
